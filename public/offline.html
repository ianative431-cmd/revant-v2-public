<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#803e2f">
  <title>Revant — hors connexion</title>
  <style>
    :root{color-scheme:light;--bg:#a79986;--accent:#803e2f;--text:#1f1d20}
    *{box-sizing:border-box}
    body{margin:0;min-height:100svh;padding:24px;display:grid;place-items:center;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
    main{width:min(100%,480px);padding:clamp(24px,6vw,40px);border-radius:24px;background:#f7f3ee;box-shadow:0 16px 48px #1f1d2020;text-align:center}
    img{width:76px;height:76px;object-fit:contain;margin:0 auto 16px}
    h1{font-size:clamp(1.5rem,5vw,2rem);line-height:1.2;margin:0 0 12px}
    p{margin:0 0 22px}
    button{min-height:48px;padding:12px 22px;border:0;border-radius:999px;background:var(--accent);color:white;font:inherit;font-weight:700;cursor:pointer}
    button:focus-visible{outline:3px solid var(--text);outline-offset:3px}
  </style>
</head>
<body>
  <main>
    <img src="/images/logo-revant.svg" alt="Revant">
    <h1>Vous êtes hors connexion</h1>
    <p>Revant a besoin d’Internet pour charger les boutiques et synchroniser les données. Vérifiez votre connexion puis réessayez.</p>
    <button type="button" onclick="location.reload()">Réessayer</button>
  </main>
</body>
</html>
