name: One-time Next.js security update

on:
  push:
    branches:
      - feat/revant-full-integration-2026-11-01
    paths:
      - .github/workflows/update-next-security.yml

permissions:
  contents: write

jobs:
  update-next:
    if: github.ref == 'refs/heads/feat/revant-full-integration-2026-11-01'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Update patched Next.js packages and lockfile
        run: npm install --package-lock-only --save-exact next@16.4.3 eslint-config-next@16.4.3 --ignore-scripts --no-audit --no-fund
      - name: Apply non-breaking npm security fixes
        run: npm audit fix --package-lock-only --ignore-scripts --no-fund --no-audit
      - name: Report remaining npm advisories
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node - <<'NODE'
          const audit = require('/tmp/npm-audit.json');
          console.log('npm audit summary:', JSON.stringify(audit.metadata?.vulnerabilities ?? {}));
          for (const [name, item] of Object.entries(audit.vulnerabilities ?? {})) {
            console.log(JSON.stringify({ package: name, severity: item.severity, direct: item.isDirect, range: item.range, fixAvailable: item.fixAvailable, advisories: item.via.filter((v) => typeof v === 'object').map((v) => ({ title: v.title, url: v.url, range: v.range })) }));
          }
          NODE
      - name: Commit updated package files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes required."
            exit 0
          fi
          git commit -m "fix: upgrade Next.js security patches"
          git push origin "HEAD:${GITHUB_REF_NAME}"
