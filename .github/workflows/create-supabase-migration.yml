name: Create Supabase migration
on:
  workflow_dispatch:
    inputs:
      migration_name:
        description: "Migration name in snake_case"
        required: true
        type: string
permissions:
  contents: read
jobs:
  create:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: \${{ github.ref }}
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Generate and commit migration file
        env:
          MIGRATION_NAME: \${{ inputs.migration_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$MIGRATION_NAME" =~ ^[a-z0-9_]+$ ]]; then
            echo "Migration name must contain lowercase letters, digits, and underscores only."
            exit 1
          fi
          supabase migration new "$MIGRATION_NAME"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations
          git commit -m "chore: create Supabase migration $MIGRATION_NAME"
          git push origin "HEAD:\${GITHUB_REF_NAME}"
