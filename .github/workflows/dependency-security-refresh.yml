name: Revant dependency security refresh
on:
  push:
    branches:
      - "security/**"
    paths:
      - ".github/workflows/dependency-security-refresh.yml"
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      SUPABASE_SERVICE_ROLE_KEY: build-only-placeholder
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refresh supported major versions and fixable dependencies
        run: |
          npm install --save-exact 'next@^16' 'eslint-config-next@^16' 'react@^19' 'react-dom@^19'
          npm audit fix || true
      - name: Verify no high or critical advisories remain
        run: npm audit --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Commit verified dependency lockfile
        run: |
          if ! git diff --quiet -- package.json package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "chore(security): refresh Next React and audited dependencies"
            git push origin "HEAD:${{ github.ref_name }}"
          else
            echo "Dependencies already current; no commit needed."
          fi
