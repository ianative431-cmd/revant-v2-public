name: Regenerate Next.js security lockfile

on:
  push:
    branches:
      - fix/next-16-4-6-security

permissions:
  contents: write

jobs:
  regenerate:
    if: "!contains(github.event.head_commit.message, 'regenerate lockfile')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout security branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore current main lockfile baseline
        run: |
          git fetch origin main
          git show origin/main:package-lock.json > package-lock.json
      - name: Regenerate lockfile for pinned Next.js versions
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify production dependency audit
        run: npm audit --omit=dev --audit-level=moderate
      - name: Commit regenerated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already up to date."
            exit 0
          fi
          git commit -m "chore: regenerate lockfile with patched Next.js"
          git push origin "HEAD:${{ github.ref_name }}"
