name: Generate Supabase migration filename with CLI
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout requested branch
        uses: actions/checkout@v4
        with:
          ref: \${{ github.ref_name }}
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Generate and commit timestamped migration
        shell: bash
        run: |
          set -euo pipefail
          existing="supabase/migrations/20261128071000_super_admin_trusted_session_boundary.sql"
          temp_file="$(mktemp)"
          cp "$existing" "$temp_file"
          supabase migration new super_admin_trusted_session_boundary
          generated="$(find supabase/migrations -maxdepth 1 -type f -name '*_super_admin_trusted_session_boundary.sql' ! -path "$existing" | sort | tail -n 1)"
          test -n "$generated"
          cp "$temp_file" "$generated"
          rm "$temp_file" "$existing"
          rm .github/workflows/create-migration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations .github/workflows/create-migration.yml
          git commit -m "chore: generate Supabase migration filename with CLI"
          git push origin "HEAD:\${GITHUB_REF_NAME}"
