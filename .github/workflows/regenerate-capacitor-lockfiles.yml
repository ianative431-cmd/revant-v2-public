name: Regenerate Capacitor OAuth lockfiles

on:
  push:
    branches:
      - fix/capacitor-google-oauth-pkce

permissions:
  contents: write

jobs:
  regenerate:
    if: "!contains(github.event.head_commit.message, 'regenerate Capacitor lockfiles')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate web lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Regenerate Capacitor wrapper lockfile
        working-directory: android-apps/revant
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json android-apps/revant/package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: regenerate Capacitor lockfiles"
          git push origin "HEAD:${{ github.ref_name }}"
