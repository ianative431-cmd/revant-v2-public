name: Validate dispute management workflow
on:
  pull_request:
    paths:
      - "supabase/migrations/20261128080319_dispute_management_guardrails.sql"
      - "supabase/ci/disputes-admin-*.sql"
      - ".github/workflows/disputes-admin-sql.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dispute-postgres:
    name: PostgreSQL 17 dispute workflow tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: revant_disputes_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d revant_disputes_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Create isolated dispute fixture
        env:
          PGPASSWORD: ci-only-password
        run: psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d revant_disputes_test -f supabase/ci/disputes-admin-bootstrap.sql
      - name: Apply dispute guardrails migration
        env:
          PGPASSWORD: ci-only-password
        run: psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d revant_disputes_test -f supabase/migrations/20261128080319_dispute_management_guardrails.sql
      - name: Run dispute workflow tests
        env:
          PGPASSWORD: ci-only-password
        run: psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d revant_disputes_test -f supabase/ci/disputes-admin.test.sql
