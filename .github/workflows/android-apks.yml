name: Build Android APKs

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "android-apps/**"
      - "public/images/logo-super-admin-512.png"
      - "public/images/logo-revant-app-192.png"
      - "public/images/logo-revant-app-512.png"
      - ".github/workflows/android-apks.yml"
  push:
    branches:
      - "feat/super-admin-local-first"
    paths:
      - "android-apps/**"
      - "public/images/logo-super-admin-512.png"
      - "public/images/logo-revant-app-192.png"
      - "public/images/logo-revant-app-512.png"
      - ".github/workflows/android-apks.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.app.label }} APK
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - id: revant
            label: Revant
            directory: android-apps/revant
            artifact: revant-debug-apk
          - id: super-admin
            label: Revant Super Admin
            directory: android-apps/super-admin
            artifact: revant-super-admin-debug-apk
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Capacitor dependencies
        working-directory: ${{ matrix.app.directory }}
        run: npm install
      - name: Generate Android project
        working-directory: ${{ matrix.app.directory }}
        run: npx cap add android
      - name: Prepare official Revant launcher icon
        if: matrix.app.id == 'revant'
        working-directory: ${{ matrix.app.directory }}
        env:
          LOGO_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/public/images/logo-revant-app-512.png
        run: |
          mkdir -p assets
          curl --fail --location --silent --show-error "$LOGO_URL" -o /tmp/revant-official-logo.png
          npm install --no-save --package-lock=false @capacitor/assets sharp
          node - <<'NODE'
          const sharp = require('sharp');
          sharp('/tmp/revant-official-logo.png')
            .resize(1024, 1024, { fit: 'contain' })
            .png()
            .toFile('assets/logo.png')
            .then(() => console.log('Official Revant launcher icon prepared at 1024x1024'))
            .catch((error) => { console.error(error); process.exit(1); });
          NODE
          npx capacitor-assets generate --android --iconBackgroundColor '#C76A35' --splashBackgroundColor '#A79986'
      - name: Prepare official Super Admin launcher icon
        if: matrix.app.id == 'super-admin'
        working-directory: ${{ matrix.app.directory }}
        env:
          LOGO_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/public/images/logo-super-admin-512.png
        run: |
          mkdir -p assets
          curl --fail --location --silent --show-error "$LOGO_URL" -o /tmp/revant-super-admin-logo.png
          npm install --no-save --package-lock=false @capacitor/assets sharp
          node - <<'NODE'
          const sharp = require('sharp');
          sharp('/tmp/revant-super-admin-logo.png')
            .resize(1024, 1024, { fit: 'contain' })
            .png()
            .toFile('assets/logo.png')
            .then(() => console.log('Official Super Admin logo prepared at 1024x1024'))
            .catch((error) => { console.error(error); process.exit(1); });
          NODE
          npx capacitor-assets generate --android --iconBackgroundColor '#203426' --splashBackgroundColor '#171013'
      - name: Build debug APK
        working-directory: ${{ matrix.app.directory }}/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app.artifact }}
          path: ${{ matrix.app.directory }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
