name: Build Android APKs

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "android-apps/**"
      - ".github/workflows/android-apks.yml"
  push:
    branches:
      - "feat/super-admin-local-first"
    paths:
      - "android-apps/**"
      - ".github/workflows/android-apks.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.app.label }} APK
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - id: revant
            label: Revant
            directory: android-apps/revant
            artifact: revant-debug-apk
          - id: super-admin
            label: Revant Super Admin
            directory: android-apps/super-admin
            artifact: revant-super-admin-debug-apk
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Capacitor dependencies
        working-directory: ${{ matrix.app.directory }}
        run: npm install
      - name: Generate Android project
        working-directory: ${{ matrix.app.directory }}
        run: npx cap add android
      - name: Build debug APK
        working-directory: ${{ matrix.app.directory }}/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app.artifact }}
          path: ${{ matrix.app.directory }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
