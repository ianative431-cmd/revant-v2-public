name: Validate Super Admin trusted-device session boundary
on:
  pull_request:
    paths:
      - "supabase/migrations/20261128071152_super_admin_trusted_session_boundary.sql"
      - "supabase/ci/super-admin-device-session-*.sql"
      - "src/server/auth/super-admin.ts"
      - "src/app/admin-connexion/actions.ts"
      - ".github/workflows/super-admin-device-session-sql.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trusted-session-postgres:
    name: PostgreSQL 17 trusted-device session tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: revant_super_admin_device_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d revant_super_admin_device_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Create isolated Supabase Auth and role schema
        env:
          PGPASSWORD: ci-only-password
        run: psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d revant_super_admin_device_test -f supabase/ci/super-admin-device-session-bootstrap.sql
      - name: Apply trusted-device session migration
        env:
          PGPASSWORD: ci-only-password
        run: psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d revant_super_admin_device_test -f supabase/migrations/20261128071152_super_admin_trusted_session_boundary.sql
      - name: Run trusted-device session security tests
        env:
          PGPASSWORD: ci-only-password
        run: psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d revant_super_admin_device_test -f supabase/ci/super-admin-device-session.test.sql
