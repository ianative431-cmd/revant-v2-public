name: Validate report audit and duplicate prevention
on:
  pull_request:
    paths:
      - "supabase/migrations/20261128073827_reports_active_dedup_and_audit.sql"
      - "supabase/ci/reports-audit-*.sql"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reports-postgres:
    name: PostgreSQL 17 report integrity tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: revant_reports_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d revant_reports_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Create isolated report schema
        env:
          PGPASSWORD: ci-only-password
        run: psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d revant_reports_test -f supabase/ci/reports-audit-bootstrap.sql
      - name: Apply reports migration
        env:
          PGPASSWORD: ci-only-password
        run: psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d revant_reports_test -f supabase/migrations/20261128073827_reports_active_dedup_and_audit.sql
      - name: Run report integrity tests
        env:
          PGPASSWORD: ci-only-password
        run: psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d revant_reports_test -f supabase/ci/reports-audit.test.sql
