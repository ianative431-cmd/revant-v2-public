name: Validate Super Admin recovery SQL
on:
  pull_request:
    paths:
      - "supabase/migrations/20261127130000_super_admin_recovery_and_bootstrap_claim.sql"
      - "supabase/ci/super-admin-recovery-*.sql"
      - ".github/workflows/super-admin-recovery-sql.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recovery-postgres:
    name: PostgreSQL 17 isolated Super Admin recovery tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: revant_super_admin_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d revant_super_admin_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Create isolated Supabase Auth and identity schema
        env:
          PGPASSWORD: ci-only-password
        run: psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d revant_super_admin_test -f supabase/ci/super-admin-recovery-bootstrap.sql
      - name: Apply proposed Super Admin recovery migration
        env:
          PGPASSWORD: ci-only-password
        run: psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d revant_super_admin_test -f supabase/migrations/20261127130000_super_admin_recovery_and_bootstrap_claim.sql
      - name: Run Super Admin recovery security tests
        env:
          PGPASSWORD: ci-only-password
        run: psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d revant_super_admin_test -f supabase/ci/super-admin-recovery.test.sql
