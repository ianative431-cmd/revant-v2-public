name: Validate order helper information boundaries
on:
  pull_request:
    paths:
      - "supabase/migrations/20261128092100_order_helper_information_boundary.sql"
      - "supabase/ci/order-helper-*.sql"
      - ".github/workflows/order-helper-boundary-sql.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres-17:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: revant_order_helper_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d revant_order_helper_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Bootstrap isolated schema
        env:
          PGPASSWORD: ci-only-password
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d revant_order_helper_test -f supabase/ci/admin-settings-bootstrap.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d revant_order_helper_test -f supabase/ci/order-helper-bootstrap.sql
      - name: Apply migration
        env:
          PGPASSWORD: ci-only-password
        run: psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d revant_order_helper_test -f supabase/migrations/20261128092100_order_helper_information_boundary.sql
      - name: Test participant boundaries
        env:
          PGPASSWORD: ci-only-password
        run: psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d revant_order_helper_test -f supabase/ci/order-helper-boundary.test.sql
