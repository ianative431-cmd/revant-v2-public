name: Revant
options:
  bundleIdPrefix: ne.revant
  deploymentTarget:
    iOS: "16.2"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.2"
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: YES
targets:
  Revant:
    type: application
    platform: iOS
    sources:
      - path: Revant
      - path: Shared/RevantLiveActivityAttributes.swift
    dependencies:
      - target: RevantLiveActivityExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ne.revant.marketplace
        PRODUCT_NAME: Revant
        INFOPLIST_KEY_CFBundleDisplayName: Revant
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_VERSION: "5.0"
  RevantLiveActivityExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: LiveActivity
      - path: Shared/RevantLiveActivityAttributes.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ne.revant.marketplace.LiveActivity
        PRODUCT_NAME: RevantLiveActivity
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.widgetkit-extension
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        SWIFT_VERSION: "5.0"
